<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f1f3f5">
    <title>メモ</title>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="メモ ホーム">メモ</a>
        <button id="logout" class="button button-quiet" type="button" hidden>ログアウト</button>
      </header>

      <section id="login-panel" class="login-panel" hidden>
        <h1>ログイン</h1>
        <form id="login-form" class="auth-form">
          <label for="email">メールアドレス</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
          <label for="password">パスワード</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button class="button button-primary" type="submit">ログイン</button>
        </form>
        <form id="new-password-form" class="auth-form" hidden>
          <label for="new-password">新しいパスワード</label>
          <input id="new-password" name="newPassword" type="password" autocomplete="new-password" minlength="12" required>
          <p class="hint">12文字以上。大文字・小文字・数字を含めてください。</p>
          <button class="button button-primary" type="submit">パスワードを設定</button>
        </form>
        <p id="login-message" class="message" role="status" aria-live="polite"></p>
      </section>

      <section id="memo-panel" hidden>
        <div class="page-heading">
          <h1>メモ一覧</h1>
          <p id="memo-count" class="count"></p>
        </div>

        <form id="memo-form" class="memo-form">
          <div class="form-heading">
            <h2 id="form-title">新しいメモ</h2>
          </div>
          <label for="memo-title">タイトル</label>
          <input id="memo-title" name="title" maxlength="200" placeholder="メモのタイトル" required>
          <label for="memo-content">本文</label>
          <textarea id="memo-content" name="content" maxlength="20000" rows="5" placeholder="メモを書く"></textarea>
          <div class="form-actions">
            <button id="cancel-edit" class="button button-quiet" type="button" hidden>キャンセル</button>
            <button class="button button-primary" type="submit"><span id="save-label">保存</span></button>
          </div>
        </form>

        <p id="app-message" class="message" role="status" aria-live="polite"></p>
        <div id="memo-list" class="memo-list" aria-live="polite"></div>
        <p id="empty-state" class="empty-state" hidden>メモはまだありません。</p>
      </section>
    </main>
  </body>
</html>
